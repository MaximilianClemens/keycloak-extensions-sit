# Unit tests on every push and pull request. The Keycloak version is the one pinned in pom.xml;
# keycloak-compat.yml covers newer releases.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run unit tests
        run: mvn -B --no-transfer-progress test

      - name: Summary
        if: always()
        run: |
          {
            echo "### Surefire"
            echo
            echo '```'
            cat target/surefire-reports/*.txt 2>/dev/null | grep -E "^Tests run|^Test set" || echo "no reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
