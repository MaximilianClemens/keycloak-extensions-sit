# Prüft jedes neue Keycloak-Release automatisch gegen unsere Extensions.
#
# Täglich wird die neueste finale Keycloak-Version aus Maven Central ermittelt. Ist sie
# neuer als keycloak.version in pom.xml und gibt es noch kein Issue dazu, läuft
# ci/kc-compat/run-all.sh (Build, Tests, Bytecode-, API- und Abhängigkeitsvergleich,
# Keycloak-Start mit altem und neuem Jar) und das Ergebnis landet als Issue im Repo.
#
# Manuell: Actions → "Keycloak-Kompatibilität" → Run workflow, optional mit Versionen.
# Erneut prüfen lassen: Issue der Version löschen oder den Workflow manuell starten.
name: Keycloak-Kompatibilität

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Zu prüfende Keycloak-Version (leer = neueste)"
        required: false
        default: ""
      baseline_version:
        description: "Basisversion des alten Jars (leer = keycloak.version aus pom.xml)"
        required: false
        default: ""
      create_issue:
        description: "Ergebnis als Issue anlegen bzw. kommentieren"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: keycloak-compat
  cancel-in-progress: false

jobs:
  detect:
    name: Neue Version ermitteln
    runs-on: ubuntu-24.04   # fest, damit ein Image-Wechsel (z. B. vorinstalliertes Maven) nichts unbemerkt ändert
    outputs:
      version: ${{ steps.v.outputs.version }}
      baseline: ${{ steps.v.outputs.baseline }}
      title: ${{ steps.v.outputs.title }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.keycloak_version }}
          INPUT_BASELINE: ${{ inputs.baseline_version }}
        run: |
          NEW="${INPUT_VERSION:-$(ci/kc-compat/latest-version.sh)}"
          BASE="${INPUT_BASELINE:-$(sed -n 's:.*<keycloak.version>\(.*\)</keycloak.version>.*:\1:p' pom.xml | head -n 1)}"
          TITLE="[kc-compat] Keycloak $NEW – Kompatibilitätscheck"
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$NEW" = "$BASE" ]; then
              echo "Keycloak $NEW ist bereits die Basisversion – nichts zu tun."
              RUN=false
            elif [ "$(printf '%s\n%s\n' "$NEW" "$BASE" | sort -V | tail -n 1)" != "$NEW" ]; then
              echo "Keycloak $NEW ist älter als die Basisversion $BASE – nichts zu tun."
              RUN=false
            elif [ -n "$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" \
                         --json title --jq ".[] | select(.title == \"$TITLE\") | .title")" ]; then
              echo "Für Keycloak $NEW gibt es bereits ein Issue – nichts zu tun."
              RUN=false
            fi
          fi
          echo "Neu: $NEW, Basis: $BASE, Prüfen: $RUN"
          {
            echo "version=$NEW"
            echo "baseline=$BASE"
            echo "title=$TITLE"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Keycloak ${{ needs.detect.outputs.version }} prüfen
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04   # fest, damit ein Image-Wechsel (z. B. vorinstalliertes Maven) nichts unbemerkt ändert
    timeout-minutes: 45
    env:
      WORK_DIR: ${{ github.workspace }}/.kc-compat
      NEW: ${{ needs.detect.outputs.version }}
      BASE: ${{ needs.detect.outputs.baseline }}
    steps:
      - uses: actions/checkout@v5

      # Keycloak 26 läuft nur auf Java 21+; unser Code wird trotzdem für Java 17 kompiliert.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Kompatibilitätscheck
        id: check
        continue-on-error: true
        run: ci/kc-compat/run-all.sh "$NEW" "$BASE"

      - name: Job-Zusammenfassung
        if: always()
        run: |
          if [ -f "$WORK_DIR/report.md" ]; then
            head -c 900000 "$WORK_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein Report erzeugt – siehe Log des Schritts 'Kompatibilitätscheck'." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kc-compat-report
          path: |
            .kc-compat/report.md
            .kc-compat/summary.md
            .kc-compat/build-*.log
            .kc-compat/smoke-*.log
            .kc-compat/smoke-*.out
          include-hidden-files: true   # .kc-compat/ beginnt mit einem Punkt
          if-no-files-found: warn
          retention-days: 90

      - name: Issue anlegen
        if: always() && (github.event_name == 'schedule' || inputs.create_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.detect.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          if [ -f "$WORK_DIR/issue.md" ]; then
            cp "$WORK_DIR/issue.md" "$body"
          else
            echo "Der Kompatibilitätscheck hat keinen Report erzeugt (Abbruch)." > "$body"
          fi
          printf '\n\nWorkflow-Lauf mit vollständigem Report: %s\n' "$RUN_URL" >> "$body"

          existing=$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" \
                       --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

      - name: Ergebnis
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Kompatibilitätscheck gegen Keycloak $NEW ist fehlgeschlagen – siehe Zusammenfassung."
          exit 1
