# End-to-end test of the on-demand Kerberos authenticator (sit-auth-spnego-button):
# throwaway MIT KDC on the runner, the real Keycloak distribution with our jar, the login
# played with curl --negotiate. See ci/kerberos-e2e/run.sh.
name: Kerberos e2e

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version (empty = keycloak.version from pom.xml)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: KDC + Keycloak + curl --negotiate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install MIT Kerberos
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q krb5-kdc krb5-admin-server krb5-user krb5-pkinit
          curl --version | grep -qE "GSS-API|Kerberos|SPNEGO" || { echo "curl without SPNEGO support"; exit 1; }

      - name: Build provider jar
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Run end-to-end test
        env:
          INPUT_VERSION: ${{ inputs.keycloak_version }}
        run: |
          set -o pipefail
          ci/kerberos-e2e/run.sh ${INPUT_VERSION:+"$INPUT_VERSION"} 2>&1 | tee e2e-run.log

      - name: Report failures as annotations
        if: failure()
        run: |
          { grep -E "^FAIL |^\[e2e\]|^\[kdc\]|ERROR|Traceback|Error|rror:|denied|No such" e2e-run.log; echo "--- tail:"; tail -n 15 e2e-run.log; } \
            | head -n 60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Kerberos e2e"
            echo
            echo '```'
            cat .kerberos-e2e/e2e.out 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kerberos-e2e
          path: |
            .kerberos-e2e/e2e.out
            .kerberos-e2e/keycloak.log
            e2e-run.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
